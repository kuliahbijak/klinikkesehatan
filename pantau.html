  <style>
    body { background: var(--bg); }
    .pt { max-width: 560px; margin: 0 auto; padding: 1rem 1rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
    .pt-head { display: flex; align-items: center; gap: .75rem; padding: .25rem 0; }
    .pt-head .logo-box { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
    .pt-head h1 { font-size: 17px; line-height: 22px; font-weight: 800; }
    .tiket { position: relative; overflow: hidden; text-align: center; }
    .tiket::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--amber); }
    .tiket .no { font-size: 64px; line-height: 1; font-weight: 800; color: var(--primary); letter-spacing: -.03em; margin: .4rem 0 .2rem; }
    .tiket.dipanggil { background: var(--primary); color: #fff; border: 0; }
    .tiket.dipanggil .no { color: #fff; } .tiket.dipanggil .muted { color: var(--primary-fixed); }
    .tiket.dipanggil::before { background: var(--amber); animation: kedip 1s infinite; }
    .posisi { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: 1rem; }
    .posisi > div { background: var(--bg); border-radius: 12px; padding: .7rem; }
    .posisi b { display: block; font-size: 24px; line-height: 30px; font-family: var(--mono); }
    .tiket.dipanggil .posisi > div { background: rgba(255,255,255,.12); }
    .sp { display: flex; align-items: center; gap: .75rem; padding: .8rem .9rem; border-radius: 14px; background: #fff; border: 1px solid #EEF0F2; box-shadow: var(--shadow); }
    .sp .nob { width: 62px; height: 56px; border-radius: 12px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
    .sp .nob small { font-size: 9px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
    .sp .nob b { font-size: 18px; font-weight: 800; color: var(--primary); font-family: var(--mono); }
    .sp .nob b.kosong { color: #C9CED6; }
    .sp.saya { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(242,177,52,.25); }
    .verif { text-align: center; }
    .verif .ikon { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto .75rem; }
    .verif .ikon .ms { font-size: 40px; }
    .verif.sah .ikon { background: var(--ok-soft); color: var(--ok-text); }
    .verif.batal .ikon { background: var(--amber-soft); color: var(--amber-text); }
    .verif.tolak .ikon { background: var(--danger-soft); color: var(--danger-text); }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: .45rem 1rem; text-align: left; margin-top: 1rem; font-size: 14px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; text-align: right; }
    .foot { text-align: center; font-size: 12px; color: var(--muted); }
    @keyframes kedip { 50% { opacity: .35; } }
  </style>
